[package]
name = "bishudeck"
version = "0.1.4"
description = "Bishudeck"
authors = ["TominagaTeam"]
edition = "2021"

[lib]
name = "hse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
thiserror = "2"
